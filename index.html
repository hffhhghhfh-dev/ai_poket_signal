<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI POCKET OPTION PRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#07111f;color:#fff;font-family:Arial,sans-serif}
h2{text-align:center;color:#31d6ff}
.card{background:#111f32;padding:16px;border-radius:14px;margin:12px 0}
label{display:block;color:#aabbd1;margin:12px 0 8px}
select,button{width:100%;padding:13px;border:0;border-radius:9px;font-size:16px}
select{background:#20334c;color:white}
button{background:#087fba;color:white;font-weight:bold;margin-top:12px}
button:disabled{opacity:.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.time{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.time button{background:#20334c;margin:0}
.time button.active{background:#008dcc}
#result{text-align:center;font-size:24px;font-weight:bold;padding:18px}
#details{color:#b9c9dc;line-height:1.7;white-space:pre-line}
.small{font-size:12px;color:#91a6bd;text-align:center}
.green{color:#35e69b}
.red{color:#ff6565}
</style>
</head>
<body>

<h2>AI POCKET OPTION PRO</h2>
<p class="small">Рыночный анализ на основе свечей</p>

<div class="card">
<label>Тип рынка</label>
<select id="market" onchange="updatePairs()">
<option value="otc">OTC</option>
<option value="forex">REAL</option>
</select>

<label>Валютная пара</label>
<select id="pair"></select>

<label>Таймфрейм</label>
<div class="time">
<button onclick="setTF(5,this)">S5</button>
<button onclick="setTF(15,this)">S15</button>
<button onclick="setTF(30,this)">S30</button>
<button onclick="setTF(60,this)" class="active">M1</button>
<button onclick="setTF(120,this)">M2</button>
<button onclick="setTF(300,this)">M5</button>
</div>

<button id="analyze" onclick="analyze()">АНАЛИЗИРОВАТЬ</button>
</div>

<div class="card">
<div id="result">ОЖИДАНИЕ АНАЛИЗА</div>
<div id="details">Выбери рынок, пару и таймфрейм.</div>
</div>

<div class="card">
<b>Индикаторы</b>
<div id="indicators">Пока нет данных</div>
</div>

<p class="small">Сигналы не гарантируют прибыль. Используй демо-счёт для проверки.</p>

<script>
const API="https://ai-poket-signal.onrender.com";

let timeframe=60;

const pairs={
otc:[
["EUR/USD","EURUSD_otc"],
["GBP/USD","GBPUSD_otc"],
["USD/JPY","USDJPY_otc"],
["AUD/USD","AUDUSD_otc"],
["USD/CAD","USDCAD_otc"],
["EUR/JPY","EURJPY_otc"],
["GBP/JPY","GBPJPY_otc"],
["EUR/GBP","EURGBP_otc"],
["AUD/JPY","AUDJPY_otc"]
],
forex:[
["EUR/USD","EURUSD"],
["GBP/USD","GBPUSD"],
["USD/JPY","USDJPY"],
["AUD/USD","AUDUSD"],
["USD/CAD","USDCAD"],
["EUR/JPY","EURJPY"],
["GBP/JPY","GBPJPY"],
["EUR/GBP","EURGBP"],
["AUD/JPY","AUDJPY"]
]
};

function updatePairs(){
 const market=document.getElementById("market").value;
 const select=document.getElementById("pair");
 select.innerHTML="";
 pairs[market].forEach(p=>{
  const option=document.createElement("option");
  option.value=p[1];
  option.textContent=p[0];
  select.appendChild(option);
 });
}

function setTF(tf,btn){
 timeframe=tf;
 document.querySelectorAll(".time button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
}

function ema(values,period){
 let k=2/(period+1);
 let result=values[0];
 for(let i=1;i<values.length;i++){
  result=values[i]*k+result*(1-k);
 }
 return result;
}

function rsi(values,period=14){
 let gains=0,losses=0;
 for(let i=values.length-period;i<values.length;i++){
  let diff=values[i]-values[i-1];
  if(diff>0) gains+=diff;
  else losses-=diff;
 }
 if(losses===0)return 100;
 let rs=(gains/period)/(losses/period);
 return 100-(100/(1+rs));
}

function macd(values){
 const fast=ema(values.slice(-26),12);
 const slow=ema(values.slice(-26),26);
 return fast-slow;
}

async function analyze(){
 const btn=document.getElementById("analyze");
 const result=document.getElementById("result");
 const details=document.getElementById("details");
 const indicators=document.getElementById("indicators");

 const market=document.getElementById("market").value;
 const symbol=document.getElementById("pair").value;

 if(market==="forex" && timeframe<60){
  result.textContent="НЕТ СИГНАЛА";
  details.textContent="Для REAL доступны таймфреймы от M1.";
  return;
 }

 btn.disabled=true;
 btn.textContent="ЗАГРУЗКА...";
 result.textContent="АНАЛИЗ...";
 details.textContent="Получаем рыночные свечи...";
 indicators.textContent="";

 try{
  const url=API+"/api/candles?venue="+market+
   "&symbol="+encodeURIComponent(symbol)+
   "&tf="+timeframe+"&limit=300";

  const response=await fetch(url);
  const data=await response.json();

  if(!response.ok){
   throw new Error(JSON.stringify(data));
  }

  if(!data.candles || data.candles.length<50){
   throw new Error("Недостаточно свечей для анализа.");
  }

  if(data.gaps && data.gaps.runs>0){
   throw new Error("В истории есть пропуски свечей. Анализ остановлен.");
  }

  const candles=data.candles;
  const closes=candles.map(c=>Number(c.close));

  if(closes.some(x=>!Number.isFinite(x))){
   throw new Error("Некорректные цены.");
  }

  const last=closes[closes.length-1];
  const r=rsi(closes);
  const e9=ema(closes.slice(-100),9);
  const e21=ema(closes.slice(-100),21);
  const e50=ema(closes.slice(-150),50);
  const e200=ema(closes,200);
  const m=macd(closes);

  let up=0,down=0;

  if(e9>e21)up++;else down++;
  if(e21>e50)up++;else down++;
  if(e50>e200)up++;else down++;
  if(m>0)up++;else down++;
  if(r>50)up++;else down++;

  let signal="НЕТ СИГНАЛА";
  let color="";

  if(up>=4 && r<70){
   signal="ВВЕРХ ↑";
   color="green";
  }else if(down>=4 && r>30){
   signal="ВНИЗ ↓";
   color="red";
  }

  result.textContent=signal;
  result.className=color;

  details.textContent=
   "Рынок: "+market.toUpperCase()+
   "\nПара: "+symbol+
   "\nТаймфрейм: "+timeframe+" секунд"+
   "\nЦена: "+last+
   "\nСвечей: "+candles.length+
   "\nСовпадений вверх: "+up+
   "\nСовпадений вниз: "+down+
   "\nRSI: "+r.toFixed(2)+
   "\nMACD: "+m.toFixed(6);

  indicators.textContent=
   "EMA 9: "+e9.toFixed(6)+
   "\nEMA 21: "+e21.toFixed(6)+
   "\nEMA 50: "+e50.toFixed(6)+
   "\nEMA 200: "+e200.toFixed(6)+
   "\nRSI: "+r.toFixed(2)+
   "\nMACD: "+m.toFixed(6);

 }catch(error){
  result.textContent="НЕТ СИГНАЛА";
  result.className="";
  details.textContent="Ошибка получения данных:\n"+error.message;
  indicators.textContent="Проверь API, ключ и доступность выбранного рынка.";
 }finally{
  btn.disabled=false;
  btn.textContent="АНАЛИЗИРОВАТЬ";
 }
}

if(window.Telegram && window.Telegram.WebApp){
 Telegram.WebApp.ready();
 Telegram.WebApp.expand();
}

updatePairs();
</script>
</body>
</html>
